<p-dialog [(visible)]="visible" header="Configuració de dates de moduls" [modal]="true" (onHide)="onConfirm.emit()"
  [style]="{ width: '55vw'}">
  @if (formGroup) {
  <p-table [value]="modulesCourses" scrollHeight="60vh" [formGroup]="formGroup">
    <ng-template #header>
      <tr>
        <th>Nom</th>
        <th style="width: 7rem;">Curs</th>
        <th>Data d'inici</th>
      </tr>
    </ng-template>
    <ng-template #body let-module>
      <tr>
        <td>{{ module.nom }}</td>
        <td>{{ module.course }}</td>
        <td class="datepicker">
          <p-datepicker [formControlName]="module.idmodul + '_' + module.course" appendTo="body" [showIcon]="true"
            dateFormat="dd/mm/yy" [minDate]="limitDates[0]" [maxDate]="limitDates[1]"
            [ngClass]="{ 'ng-invalid ng-dirty': formGroup.get(module.idmodul + '_' + module.course)?.invalid && formGroup.get(module.idmodul + '_' + module.course)?.dirty }"></p-datepicker>
        </td>
      </tr>
    </ng-template>
  </p-table>
  }
</p-dialog>

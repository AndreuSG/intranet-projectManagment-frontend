<full-calendar [options]="calendarOptions"></full-calendar>

<p-dialog [header]="selectedEvent ? 'Editar esdeveniment' : 'Nou esdeveniment'" [(visible)]="showDialog" [modal]="true" [style]="{width: '30rem'}">
  <app-calendar-event-form
    [date]="selectedDate"
    [event]="selectedEvent"
    (closed)="onCloseDialog($event)">
  </app-calendar-event-form>
</p-dialog>

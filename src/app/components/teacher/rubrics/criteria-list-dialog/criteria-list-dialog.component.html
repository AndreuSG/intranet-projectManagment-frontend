<div class="criteria-dialog">

    <!-- CABECERA -->
    <header class="header">
        <h3 class="title">
            Criteris (puntuació màxima: {{ maxScore | number:'1.2-2' }})
        </h3>

        <button pButton type="button" label="Afegir criteri" icon="pi pi-plus" class="add-btn"
            (click)="openNewCriterion()">
        </button>
    </header>

    <!-- SPINNER -->
    <p-progressSpinner *ngIf="loading" class="center-spinner"></p-progressSpinner>

    <!-- TABLA -->
    <p-table *ngIf="!loading" [value]="criteria" [responsiveLayout]="'scroll'"
        [style]="{ 'margin-top': criteria.length ? '1rem' : '0' }">

        <ng-template pTemplate="header">
            <tr>
                <th>Nom</th>
                <th class="w-7rem text-right">Pes %</th>
                <th class="w-4rem text-center">Nivells</th>
                <th class="w-6rem text-center">Accions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
            <tr>
                <td>{{ row.nom }}</td>
                <td class="text-right">{{ row.pes }}</td>
                <td class="text-center">
                    <button
                        pButton
                        type="button"
                        icon="pi pi-list"
                        label="Nivells"
                        class="p-button-sm p-button-text"
                        (click)="openLevelsDialog(row)">
                    </button>
                </td>
                <td class="text-center">
                    <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-danger"
                        (click)="delete(row.id!)">
                    </button>
                </td>
            </tr>
        </ng-template>

    </p-table>

    <!-- VACÍO -->
    <p *ngIf="!loading && criteria.length === 0" class="empty-msg">
        No hi ha criteris per aquesta rúbrica.
    </p>
</div>
<p-confirmDialog></p-confirmDialog>

<p-dialog [(visible)]="visible" header="Selecció dels moduls de projecte" [modal]="true" (onHide)="onConfirm.emit()">
  <div class="modules-table-header">
    <p-select
      (onChange)="dt1.filter($event.value?.estudis, 'estudis', 'contains')"
      [options]="studies"
      [(ngModel)]="selectedCourse"
      [checkmark]="true"
      [showClear]="true"
      optionLabel="estudis"
      placeholder="Selecciona un estudi"
    />
    <p-iconfield iconPosition="left" class="ml-auto">
      <p-inputicon>
        <i class="pi pi-search"></i>
      </p-inputicon>
      <input
        pInputText
        type="text"
        (input)="onFilterName($event)"
        placeholder="Busca moduls"
      />
    </p-iconfield>
    <p-button
      (click)="confirmModules()"
      label="Confirmar"
      severity="success"
      icon="pi pi-check"
      [disabled]="!isValidSelection()"
      pTooltip="Selecciona com a máxim 1 modul de cada estudi"
      tooltipPosition="bottom"
      [tooltipDisabled]="isValidSelection()"
    />
  </div>
  <p-table #dt1
    [loading]="loading"
    [value]="modulesCourses"
    selectionMode="multiple"
    [(selection)]="selectedModules"
    [metaKeySelection]="false"
    dataKey="code"
    [tableStyle]="{'min-width': '40rem'}"
    [scrollable]="true"
    scrollHeight="400px"
  >
    <ng-template #header>
        <tr>
          <th style="width: 3rem;">Curriculum</th>
          <th style="width: 6.5rem;">Estudis</th>
          <th>Nom</th>
        </tr>
    </ng-template>
    <ng-template #body let-module let-rowIndex="rowIndex">
        <tr [pSelectableRow]="module" [pSelectableRowIndex]="rowIndex">
          <td>{{module.curriculum}}</td>
          <td>{{module.course}}</td>
          <td>{{module.nom}}</td>
        </tr>
    </ng-template>
  </p-table>
</p-dialog>
